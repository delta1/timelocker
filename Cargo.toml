[package]
name = "timelocker"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.5", features = ["csr", "tracing"] }
leptos_meta = { version = "0.5", features = ["csr"] }
leptos_router = { version = "0.5", features = ["csr"] }
log = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
tracing = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
